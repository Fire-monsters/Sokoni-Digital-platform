name: Wholesale release
on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/sme-dashboard/**"
      - "apps/agro-warehouse/**"
      - "packages/**"
      - "tooling/**"
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/wholesale-release.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      # Read the pnpm version from package.json, including its integrity suffix.
      - uses: pnpm/action-setup@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sokoni-digital/config typecheck && pnpm --filter @sokoni-digital/config test
      - run: pnpm --filter @sokoni-digital/api typecheck && pnpm --filter @sokoni-digital/api lint && pnpm --filter @sokoni-digital/api test
      - run: pnpm --filter sme-dashboard typecheck && pnpm --filter sme-dashboard test
  images:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, sme, warehouse]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Require public production configuration
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ vars.WHOLESALE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.WHOLESALE_SUPABASE_PUBLISHABLE_KEY }}
        run: test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.service }}
          platforms: linux/arm64
          load: true
          tags: sokoni-${{ matrix.service }}:check
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.WHOLESALE_SUPABASE_URL || 'https://example.supabase.co' }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.WHOLESALE_SUPABASE_PUBLISHABLE_KEY || 'public-build-test-key' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Smoke-test image
        env:
          SERVICE: ${{ matrix.service }}
        run: bash deploy/smoke-image.sh "$SERVICE" "sokoni-$SERVICE:check"
      - uses: docker/login-action@v4
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image and record digest
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        env:
          SERVICE: ${{ matrix.service }}
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/sokoni-$SERVICE:$REVISION"
          docker tag "sokoni-$SERVICE:check" "$image"
          docker push "$image"
          digest=$(docker inspect "$image" --format '{{index .RepoDigests 0}}')
          printf '%s_IMAGE=%s\n' "${SERVICE^^}" "$digest" > "image-$SERVICE.env"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        with:
          name: image-${{ matrix.service }}
          path: image-${{ matrix.service }}.env
  release:
    needs: images
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: release-images
      - run: |
          cat release-images/image-*.env > deploy/release.env
          printf 'API_ENV_FILE=/opt/sokoni/secrets/api.env\n' >> deploy/release.env
      - uses: actions/upload-artifact@v4
        with:
          name: wholesale-release-${{ github.sha }}
          path: |
            deploy/compose.yaml
            deploy/Caddyfile
            deploy/release.env
            deploy/api.env.example
            deploy/README.md
